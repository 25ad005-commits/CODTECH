<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExpensePilot Dashboard</title>
<link rel="stylesheet" href="expensepilot.css">
</head>
<body>

<div class="container">

<h1>💰 ExpensePilot Dashboard</h1>

<div class="form-box">

<h2>Add New Expense</h2>

<input
type="text"
id="expenseName"
placeholder="Expense Name">

<input
type="number"
id="amount"
placeholder="Amount">

<input
type="text"
id="category"
placeholder="Category">

<input
type="date"
id="date">

<button onclick="addExpense()">
Add Expense
</button>

</div>

<div class="summary">

<div class="card">
<h3>Total Expenses</h3>
<p id="totalExpense">₹0</p>
</div>

<div class="card">
<h3>Total Records</h3>
<p id="totalRecords">0</p>
</div>

</div>

<h2 class="title">Expense Records</h2>

<div id="expenseContainer"></div>

</div>

<script src="expensepilot.js"></script>

</body>
</html>
